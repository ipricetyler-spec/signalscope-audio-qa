name: Feature request
description: Propose a focused product or analysis improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the input, output, and how success could be tested.
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this change data flow or privacy?
      options:
        - No
        - Yes
        - Unsure
    validations:
      required: true
